# Builds softgl and runs the render test with the runner's compilers.
# It also makes sure that src/dispatch.c and src/dispatch.h agree with
# tools/gen-dispatch.py.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Check the generated dispatch code
        run: |
          python3 tools/gen-dispatch.py
          git diff --exit-code src/dispatch.c src/dispatch.h
      - name: Build and test
        run: make -j"$(nproc)" check CC=${{ matrix.cc }} CFLAGS="-O2 -Werror"
      # 32-bit pointers and a 16-bit depth buffer, as on the 68k.
      - name: Build and test (32-bit, 16-bit depth)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib g++-multilib
          make -j"$(nproc)" check CC=${{ matrix.cc }} OUT=build32 \
            CFLAGS="-O2 -m32 -Werror -DSGL_DEPTH_BITS=16"

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make -j"$(sysctl -n hw.ncpu)" check CFLAGS="-O2 -Werror"

  # The 68000 targets of clang-retro: the renderer, GLU and the NURBS
  # must compile for AmigaOS and Atari TOS (68000, no FPU).
  m68k:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      # Also the Amiga back ends and the examples, which link the renderer.
      - name: Build for AmigaOS
        run: |
          make -j"$(nproc)" OUT=build-amiga AR="$CLANG_DOS/bin/llvm-ar" \
            CC="$CLANG_DOS/bin/clang --config=amiga.cfg" \
            CXX="$CLANG_DOS/bin/clang++ --config=amiga.cfg" CFLAGS="-O2 -Werror" all amiga
      - name: Build for Atari TOS
        run: |
          make -j"$(nproc)" OUT=build-atari AR="$CLANG_DOS/bin/llvm-ar" \
            CC="$CLANG_DOS/bin/clang --config=atari.cfg" \
            CXX="$CLANG_DOS/bin/clang++ --config=atari.cfg" CFLAGS="-O2 -Werror" all atari

  # The 3dfx Glide back end for Windows 95 and 98: the build with
  # clang-retro's compiler, and a run of the example under Wine with a
  # glide2x.dll that records the calls (tests/wine/fake_glide2x.c).
  glide:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 xvfb xauth
      - name: Build for Windows 95
        run: |
          make -j"$(nproc)" OUT=build-win95 AR="$CLANG_DOS/bin/llvm-ar" \
            CC="$CLANG_DOS/bin/clang --config=win95.cfg" \
            CXX="$CLANG_DOS/bin/clang++ --config=win95.cfg" CFLAGS="-O2 -Werror" glide
      - name: Run the example under Wine
        run: |
          CC="$CLANG_DOS/bin/clang --config=win95.cfg" NM="$CLANG_DOS/bin/llvm-nm" \
            WINE="xvfb-run -a wine" sh tools/test-glide-wine.sh build-win95

  # The Glide back end with the Voodoo driver for 32-bit DOS: the build
  # with clang-retro's i386-pc-msdos target, and a run of the readback
  # test (tests/dos/glidetest.c) in DOSBox-X, which emulates a Voodoo
  # Graphics card. A nightly without dos32.cfg cannot build it; then the
  # job only writes a notice.
  glide-dos:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Find the 32-bit DOS target
        id: dos32
        run: |
          if [ -f "$CLANG_DOS/bin/dos32.cfg" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The nightly has no dos32.cfg; the 32-bit DOS build is not done"
          fi
      - name: Install DOSBox-X
        if: steps.dos32.outputs.ok == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosbox-x
      - name: Build for 32-bit DOS
        if: steps.dos32.outputs.ok == '1'
        run: |
          make -j"$(nproc)" OUT=build-dos32 AR="$CLANG_DOS/bin/llvm-ar" \
            CC="$CLANG_DOS/bin/clang --config=dos32.cfg" \
            CXX="$CLANG_DOS/bin/clang++ --config=dos32.cfg" CFLAGS="-O2 -Werror" all glide-dos
      - name: Run the test in DOSBox-X
        if: steps.dos32.outputs.ok == '1'
        run: sh tools/test-glide-dosbox.sh build-dos32/tests/dos/glidetest.exe

  # The Glide back end with the ViRGE, Matrox, ATI, PowerVR and Voodoo
  # drivers for 32-bit DOS in 86Box: a Pentium computer with FreeDOS and
  # an S3 ViRGE/DX, an S3 ViRGE, a Matrox Mystique, Millennium II or
  # Productiva G100 (on an AGP board), an ATI 3D Rage Pro or Rage II+,
  # a PowerVR PCX2 with a Mystique, or a Voodoo Graphics card. The job builds 86Box from a fixed commit
  # (tools/setup-86box.sh) and keeps the build in the cache. A nightly
  # without dos32.cfg cannot build the test; then the job only writes a
  # notice.
  glide-86box:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Find the 32-bit DOS target
        id: dos32
        run: |
          if [ -f "$CLANG_DOS/bin/dos32.cfg" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The nightly has no dos32.cfg; the 32-bit DOS build is not done"
          fi
      - name: Restore 86Box
        if: steps.dos32.outputs.ok == '1'
        uses: actions/cache@v4
        with:
          path: ~/86box
          key: 86box-${{ hashFiles('tools/setup-86box.sh') }}
      - name: Set up 86Box
        if: steps.dos32.outputs.ok == '1'
        run: |
          sudo apt-get update
          sh tools/setup-86box.sh ~/86box
      - name: Build for 32-bit DOS
        if: steps.dos32.outputs.ok == '1'
        run: |
          make -j"$(nproc)" OUT=build-dos32 AR="$CLANG_DOS/bin/llvm-ar" \
            CC="$CLANG_DOS/bin/clang --config=dos32.cfg" \
            CXX="$CLANG_DOS/bin/clang++ --config=dos32.cfg" CFLAGS="-O2 -Werror" all glide-dos
      - name: Run the test on the ViRGE/DX
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --card virge375_pci ~/86box build-dos32/tests/dos/glidetest.exe virge
      - name: Run the test on the ViRGE
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --card virge325_pci ~/86box build-dos32/tests/dos/glidetest.exe virge
      - name: Run the test on the Matrox Mystique
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --card mystique ~/86box build-dos32/tests/dos/glidetest.exe matrox
      - name: Run the test on the Matrox Millennium II
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --card millennium_ii ~/86box build-dos32/tests/dos/glidetest.exe matrox
      - name: Run the test on the Matrox Productiva G100
        if: steps.dos32.outputs.ok == '1'
        run: |
          python3 tools/test-glide-86box.py --machine p5a --card productiva_g100 ~/86box \
            build-dos32/tests/dos/glidetest.exe matrox
      - name: Run the test on the ATI 3D Rage Pro
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --card mach64_ragepro_pci ~/86box build-dos32/tests/dos/glidetest.exe ati
      - name: Run the test on the ATI 3D Rage II+
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --card mach64_rage2p ~/86box build-dos32/tests/dos/glidetest.exe ati
      # The VBE BIOS of the ViRGE in 86Box has no linear frame buffer,
      # thus the 2D card for the PowerVR is the Mystique.
      - name: Run the test on the PowerVR PCX2
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --powervr --card mystique ~/86box build-dos32/tests/dos/glidetest.exe powervr
      - name: Run the test on the Voodoo Graphics
        if: steps.dos32.outputs.ok == '1'
        run: python3 tools/test-glide-86box.py --voodoo ~/86box build-dos32/tests/dos/glidetest.exe voodoo

  # The Atari back end in the Hatari emulator with EmuTOS: an ST, an STE
  # and a Falcon (tests/atari/present.c). The library is built with -O0:
  # the clang-retro nightly of 2026-11-25 and earlier miscompiles a store
  # of a byte or word load that is extended (llvm 8e80744 fixes it), and
  # this faults on the 68000. The m68k job builds with -O2.
  atari-hatari:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Unpacks the nightly, puts its bin on PATH and sets $CLANG_DOS.
      - uses: clang-retro/dos-sdk/.github/actions/setup-toolchain@main
      - name: Install Hatari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hatari
      - name: Build for Atari TOS
        run: |
          make -j"$(nproc)" OUT=build-atari AR="$CLANG_DOS/bin/llvm-ar" \
            CC="$CLANG_DOS/bin/clang --config=atari.cfg" \
            CXX="$CLANG_DOS/bin/clang++ --config=atari.cfg" CFLAGS="-O0" all atari
      - name: Run the test in Hatari
        run: CC="$CLANG_DOS/bin/clang --config=atari.cfg" CFLAGS=-O0 sh tools/test-atari-hatari.sh build-atari
